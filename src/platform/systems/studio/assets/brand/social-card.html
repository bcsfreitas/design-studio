<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Design Studio sharing card source</title>
  <style>
    @font-face { font-family: Geist; src: url('../../../../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f7f6f2; color: #171715; font-family: Geist, sans-serif; }
    .brand { position: absolute; top: 64px; left: 64px; display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 550; letter-spacing: -.8px; }
    .brand img { width: 44px; height: 44px; }
    .dark-logo { display: none; }
    .composition { position: absolute; top: 176px; left: 64px; right: 64px; height: 340px; display: grid; grid-template-columns: 576px 400px; gap: 96px; align-items: center; }
    h1 { margin: 0; font-size: 58px; line-height: 1.08; font-weight: 560; letter-spacing: -3px; }
    .description { max-width: 560px; margin: 28px 0 0; font-size: 23px; line-height: 1.45; color: #65645e; letter-spacing: -.45px; }
    .scene { display: block; width: 400px; height: auto; }
    .grid { stroke: #e7e5de; stroke-width: 1; }
    .card { fill: #fcfbf8; stroke: #c9c6bd; stroke-width: 1.5; }
    .line { stroke: #c9c6bd; stroke-width: 1.5; }
    .ink { stroke: #79776f; stroke-width: 1.5; fill: none; }
    .label { fill: #65645e; font-size: 15px; }
    .accent { fill: #bd995c; }
    .accent-line { stroke: #bd995c; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #171715; color: #f7f6f2; }
      .light-logo { display: none; } .dark-logo { display: block; }
      .description { color: #aaa89e; }
      .grid { stroke: #282823; } .card { fill: #22221e; stroke: #54534b; }
      .line { stroke: #54534b; } .ink { stroke: #aaa89e; } .label { fill: #aaa89e; }
    }
  </style>
</head>
<body>
  <div class="brand"><img class="light-logo" src="../../../../../../public/brand/design-studio-light.svg" alt=""><img class="dark-logo" src="../../../../../../public/brand/design-studio-dark.svg" alt="">Design Studio</div>
  <main class="composition">
  <div class="copy">
    <h1>Design with intent.<br>Build with an agent.</h1>
    <p class="description">Design Studio is an open source, AI prototype sandbox for designers and product managers who build.</p>

      <path class="ink" d="M81 60L104 82L81 104L58 82ZM104 82H132V121M58 82H29V121"/>

    <g transform="translate(214 288)"><path class="accent" stroke="#f7f6f2" stroke-width="2" d="M0 0L0 25L7 19L12 30L18 27L13 17L23 17Z"/><rect class="accent" x="23" y="21" width="71" height="27" rx="5"/><text x="35" y="40" fill="#171715" font-size="14">Agent</text></g>
  </svg>
  </main>

</html>
